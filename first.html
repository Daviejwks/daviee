<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My 3D Model</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151521;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #29243d;
        }

        h1 {
            color: #c7a8ff;
        }

        .container {
            padding: 20px;
        }

        model-viewer {
            width: 100%;
            height: 65vh;
            min-height: 350px;
            background: #222231;
            border-radius: 15px;
        }

        p {
            color: #dddddd;
        }
    </style>
</head>

<body>

    <header>
        <h1>My 3D Model</h1>
        <p>Explore the model in 3D!</p>
    </header>

    <div class="container">

        <model-viewer
            src="model_1793453716344.glb"
            alt="My 3D model"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            exposure="1"
            interaction-prompt="auto"
            loading="eager">
        </model-viewer>

        <p>Drag to rotate. Use your fingers or mouse to explore.</p>

    </div>

</body>
</html>
